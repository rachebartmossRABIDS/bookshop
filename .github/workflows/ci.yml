name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bookshop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vue/package-lock.json

      - name: Initialize database
        run: |
          # JDBC URL 声明 serverTimezone=Asia/Shanghai；容器默认 UTC，
          # 需对齐否则 now() 写入的时间会被驱动平移 8 小时（验证码过期/限流判断失效）
          mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL time_zone = '+08:00';"
          mysql -h 127.0.0.1 -uroot -proot bookshop < bookshop.sql

      - name: Prepare runtime config from examples
        working-directory: javaEEProject4/src/main/resources
        run: |
          for f in *.properties.example; do cp "$f" "${f%.example}"; done

      - name: Backend unit tests and package
        working-directory: javaEEProject4
        run: mvn -B test package

      - name: Start backend
        working-directory: javaEEProject4
        env:
          JDBC_USERNAME: root
          JDBC_PASSWORD: root
          REDIS_ENABLED: "false"
        run: |
          nohup mvn -B tomcat7:run > ../backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8090/project1/kind/list >/dev/null; then exit 0; fi
            sleep 2
          done
          cat backend.log
          exit 1

      - name: Frontend dependencies and build
        working-directory: vue
        run: npm ci && npm run build

      - name: HTTP smoke tests
        run: |
          set -o pipefail
          node smoke-test.mjs 2>&1 | tee smoke-output.txt

      - name: Publish diagnostics to job summary
        if: failure()
        run: |
          {
            echo '## Backend health recheck'
            echo '```'
            curl -sS -m 5 http://localhost:8090/project1/kind/list || echo 'BACKEND UNREACHABLE'
            echo
            mysql -h 127.0.0.1 -uroot -proot -e 'select count(*) books from bookshop.book' || echo 'MYSQL UNREACHABLE'
            echo '```'
            echo '## smoke-output.txt (tail 80)'
            echo '```'
            tail -80 smoke-output.txt 2>/dev/null || echo '(missing)'
            echo '```'
            echo '## backend.log (tail 80)'
            echo '```'
            tail -80 backend.log 2>/dev/null || echo '(missing)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo '--health--'
            curl -sS -m 5 http://localhost:8090/project1/kind/list || echo 'BACKEND_DOWN'
            echo
            echo '--mysql--'
            mysql -h 127.0.0.1 -uroot -proot -e 'select count(*) from bookshop.book' 2>&1 || echo 'MYSQL_DOWN'
            echo '--smoke-fails--'
            grep '^FAIL' smoke-output.txt 2>/dev/null | head -10
            echo '--smoke-tail--'
            tail -12 smoke-output.txt 2>/dev/null
            echo '--backendlog-tail--'
            tail -25 backend.log 2>/dev/null
          } > diag.txt
          echo "::error title=smoke-diagnostics::$(tr '\n\r' '||' < diag.txt | head -c 3000)"

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: |
            backend.log
            smoke-output.txt
            diag.txt
            javaEEProject4/logs/
